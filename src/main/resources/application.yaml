spring:
  application:
    name: auth-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auth
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  mail:
    host: smtp.mail.ru
    port: 465
    username: ${EMAIL}
    password: ${APPLICATION_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    issuer: dekanat-auth
    access-token-ttl: 15m
    refresh-token-ttl: 1d
    remember-me-refresh-token-ttl: 30d
    mfa-token-ttl: 5m
  password-reset:
    url: ${FRONTEND_URL:http://localhost:5173}/reset-password
    token-ttl: 30m
  email-change:
    code-ttl: 15m
    max-attempts: 5
  totp:
    encryption-key: ${TOTP_ENCRYPTION_KEY}
    issuer: Деканат КубГУ
    max-attempts: 5
    lockout: 15m
  rate-limit:
    password-reset:
      cooldown: 60s
      max-requests: 5
      window: 1h
    email-change:
      cooldown: 60s
      max-requests: 5
      window: 1h
  cleanup:
    cron: "0 0 3 * * *"
    zone: Europe/Moscow
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    first-name: Администратор
    last-name: Системы

management:
  health:
    redis:
      enabled: false
